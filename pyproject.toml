[project]
name = "stayops-ai"
version = "0.1.0"
description = "AI-powered serviced apartment booking operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "mcp[cli]>=2.3.0",
    "sqlalchemy",
    "uvicorn[standard]",
]

[tool.uv]
package = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]